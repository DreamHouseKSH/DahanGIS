name: Prepare reviewed dependency fixes
on:
  push:
    branches: [fix/pages-reliability-20260927]
    paths: [package.json, .github/workflows/prepare-lockfile.yml]
permissions:
  contents: write
concurrency:
  group: prepare-pages-lockfile
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-reliability-20260927
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve reviewed dependency updates without install scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update brace-expansion --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
      - name: Apply deterministic source corrections found by the browser tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/globals.css')
          text = p.read_text()
          text = text.replace("@import url('https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css');\n", '')
          text = text.replace("@import url('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css');\n", '')
          p.write_text(text)
          p = Path('src/app/layout.tsx')
          text = p.read_text()
          text = text.replace("import './globals.css';", "import 'bootstrap/dist/css/bootstrap.min.css';\nimport 'bootstrap-icons/font/bootstrap-icons.css';\nimport './globals.css';")
          text = text.replace('Bootstrap CSS and icons are loaded once, by globals.css.', 'Bootstrap CSS and icons are bundled locally once, without a CDN dependency.')
          text = text.replace('https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js', '/vendor/bootstrap.bundle.min.js')
          p.write_text(text)
          p = Path('tests/site.spec.ts')
          text = p.read_text().replace("page.getByRole('alert')", "page.locator('form.dg-form').getByRole('alert')")
          text = text.replace("expect(posts).toBe(2);\n  release?.();", "await expect.poll(() => posts).toBe(2);\n  release?.();")
          p.write_text(text)
          p = Path('tests/helpers.ts')
          text = p.read_text()
          target = "await page.getByRole('navigation', { name: '주요 메뉴', exact: true }).getByRole('link', { name: label, exact: true }).click();"
          replacement = target + "\n  const expectedHeading: Record<string, string> = { '홈': '최첨단 GIS', '서비스': '만드는 법.', '문의': '그려볼까요.' };\n  if (expectedHeading[label]) await expect(page.locator('h1')).toContainText(expectedHeading[label]);"
          assert target in text
          p.write_text(text.replace(target, replacement))
          p = Path('.gitignore')
          p.write_text(p.read_text() + '\npublic/vendor/\ndependency-audit.json\nsource-snapshot.tar\n')
          p = Path('README.md')
          text = p.read_text().replace('이미지 변형 파일이 없는 첫 개발 실행 전에는 `node scripts/optimize-images.mjs`를 실행하세요. 운영 빌드에서는 `prebuild`가 자동 실행합니다.', '`npm run dev`와 `npm run build`는 정적 이미지 변형 및 로컬 vendor 파일을 자동 준비합니다.')
          text = text.replace('Bootstrap CSS·아이콘의 로딩 위치는 `globals.css` 한 곳입니다.', 'Bootstrap CSS·아이콘은 루트 레이아웃에서 로컬 번들로 한 번만 불러오며, 레거시 JavaScript도 정적 vendor 파일로 제공합니다.')
          p.write_text(text)
          PY
      - name: Commit only reviewed files on the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json src/app/globals.css src/app/layout.tsx tests/site.spec.ts tests/helpers.ts .gitignore README.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix: lock patched image dependencies and remove CDN layout dependency'
            git push origin HEAD:fix/pages-reliability-20260927
          fi
