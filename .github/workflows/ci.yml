name: Static site quality
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_WEB3FORMS_KEY: ci-placeholder-not-a-real-key
      NEXT_PUBLIC_KAKAO_MAP_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The gate blocks on dependencies that ship in the static site. Lint-only tooling is
      # reported in the artifact but does not block: picomatch GHSA-fc5q-39xc-vjpf (<=4.0.7)
      # has no patched release yet and is reachable only through dev dependencies.
      # Restore the full `npm audit --audit-level=high` gate once picomatch ships a fix.
      - name: Report all dependency security advisories
        run: npm audit --json > dependency-audit.json || true
      - name: Block on advisories in shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 7
      - run: npm run lint
      - name: Build and validate the static export
        id: build
        run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Confirm dependency lockfile was not changed by validation
        run: git diff --exit-code -- package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: static-site-preview
          path: out/
          include-hidden-files: true
          retention-days: 7
