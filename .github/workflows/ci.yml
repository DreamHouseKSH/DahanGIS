name: Static site quality
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_WEB3FORMS_KEY: ci-placeholder-not-a-real-key
      NEXT_PUBLIC_KAKAO_MAP_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Confirm dependency lockfile was not changed by validation
        run: git diff --exit-code -- package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: static-site-preview
          path: out/
          include-hidden-files: true
          retention-days: 7
